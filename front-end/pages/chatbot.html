<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GabirIA | Enem</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16x16.png">
    <link rel="manifest" href="../img/site.webmanifest">
    <link rel="shortcut icon" href="../img/favicon.ico">
    <meta name="msapplication-TileColor" content="#6366f1">
    <meta name="theme-color" content="#111827">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/chatbot.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="antialiased flex flex-col min-h-screen overflow-hidden">

    <nav class="navbar flex-shrink-0">
        <div class="w-full px-6 md:px-5 py-3 flex justify-between items-center">
            <button id="sidebar-toggle-button" class="text-gray-300 hover:text-white focus:outline-none mr-3">
                <i class="fas fa-bars text-2xl"></i>
            </button>
            <div class="flex-grow"></div>
            <a href="../index.html" class="flex items-center text-xl font-bold gradient-text">
                <img src="../img/logo.png" alt="GabirIA Logo" class="h-7 w-auto mr-2">
                GabirIA
            </a>
            <div class="hidden md:flex space-x-4 items-center">
            </div>
        </div>
    </nav>

    <main id="main-content" class="flex-grow flex">
        
        <aside id="chat-sidebar" class="chat-sidebar">
            <div class="sidebar-header">
            </div>
            <div class="sidebar-actions">
                <a href="../index.html" class="sidebar-button">
                    <i class="fas fa-arrow-left w-5"></i>
                    <span>Voltar ao Início</span>
                </a>
                <button id="new-chat-button" class="sidebar-button">
                    <i class="fas fa-plus w-5"></i>
                    <span>Nova Conversa</span>
                </button>
            </div>
            <div class="sidebar-history flex-grow scrollable-area">
                <p class="p-4 text-xs text-gray-500">Histórico de conversas (em breve)</p>
            </div>
        </aside>

        <section class="chat-area flex-grow flex flex-col">
            <div class="chat-container flex-grow"> 
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot">Olá! Como posso te ajudar com seus estudos para o ENEM hoje?</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Envie uma mensagem para GabirIA...">
                    <button id="send-button" aria-label="Enviar mensagem">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script src="../scripts/gemini-api.js"></script>
    <script src="../scripts/chatbot.js"></script>
</body>
</html>
